  # Starship 提示符配置
  # 适合开发者的简洁美观配置

  format = """
  [┌─](bold green)$directory$git_branch$git_status$nodejs$python$rust
  [└─](bold green)$character"""

  [character]
  success_symbol = "[❯](bold green)"
  error_symbol = "[❯](bold red)"

  [directory]
  style = "bold cyan"
  truncation_length = 3
  truncate_to_repo = true
  format = "[$path]($style) "

  [git_branch]
  symbol = " "
  format = "on [$symbol$branch]($style) "
  style = "bold purple"

  [git_status]
  format = '([\[$all_status$ahead_behind\]]($style) )'
  style = "bold yellow"
  conflicted = "🏳"
  ahead = "⇡${count}"
  behind = "⇣${count}"
  diverged = "⇕⇡${ahead_count}⇣${behind_count}"
  up_to_date = "✓"
  untracked = "?${count}"
  stashed = "$${count}"
  modified = "!${count}"
  staged = "+${count}"
  renamed = "»${count}"
  deleted = "✘${count}"

  [nodejs]
  symbol = " "
  format = "via [$symbol$version]($style) "
  style = "bold green"

  [python]
  symbol = " "
  format = "via [$symbol$version]($style) "
  style = "bold yellow"

  [rust]
  symbol = " "
  format = "via [$symbol$version]($style) "
  style = "bold red"

  [cmd_duration]
  min_time = 500
  format = "took [$duration]($style) "
  style = "bold yellow"

